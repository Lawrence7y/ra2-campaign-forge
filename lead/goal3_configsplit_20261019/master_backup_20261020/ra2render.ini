[Render]
; 启用 SSE2 向量化软件 Blit 批处理加速（跳过透明块，大幅提升复杂场面渲染吞吐量）
EnableSIMD=1
;
; ══ 【VXL-PRE】VXL 缓存预热扩容（ZC-VXL-PRE / landing_pack_vxl_prewarm.md，L-VXL-1；默认 0）══
; EnableVxlCachePrewarm = 0 | 1（默认 0）
;   1 = init 时把 SomeVoxelCache Miss 插入路径首次分配粒度 mov ebx,0xA→mov ebx,0x40
;       （@0x00706D78 的 5B「BB 0A 00 00 00」内 imm8 一字节 0x0A→0x40；首次容量 10→64 条
;       ≈ 32 朝向 × 2 帧），少扩容、少 qsort。
;       · 只改 imm8 一字节；扩容步长（@0x706D7F mov ebx,eax 翻倍）、拷贝/插入/IsSorted
;         置脏、LastFoundEntry 清空、DisableVoxelCache 门（@0x70680E）全部不动。
;       · 守卫窗：@0x706D76(75 07) / @0x706D7D(EB 0A) / @0x706D7F(8B D8) 任一不符 ⇒ 拒装。
;       · 已是 BB 40… ⇒ 本进程已装（幂等）或外部安装者（停手不写不还原）。
;   0 = 不碰 .text（默认，零行为变化）。
;   ★ 安装态 init 决定，改键须重启；联机可装（D-VXL13：纯表现层缓存粒度，不进 .SAV/同步契约；
;     全端同键同档，禁一端 1 一端 0 以便遥测同口径）。
;   ★ 本卡无任何百分比收益承诺；热路径计数器（FindCalls/FindHits/QsortCalls/Growths/Inserts）
;     未实现（另卡）⇒ 只能验收「字节装上 + 无 except + 安装态可见」。
EnableVxlCachePrewarm=0

[Logic]
; TargetScanInterval: 分散敌对目标全图扫描频率（帧数），默认 8（约 0.25 秒轮询一次）
; 800 单位重载对局下，将 O(N^2) 扫描开销降低 87.5%，消除逻辑慢动作（Tick 延缓）
; 【G-08 门控】联机模式(MpActive)下无条件强制为 1（禁用节流，保证全端锁步寻敌时序逐帧一致）
TargetScanInterval=8
; L2 寻敌节流分片键：position=确定性坐标哈希（联机安全，默认）；pointer=旧指针哈希（仅单机）
; 【G-02 门控】联机模式(MpActive)下强制使用 position 键；若配置为 pointer 将强制重定向为 position 并告警
; 【RADAR-FIX F3 勘误】本键原先落在文件末尾的**第二个 [Logic] 节**里，而 Windows
; GetPrivateProfileStringA/IntA 遇到「同名节重复」时只读第一个节 ⇒ 该键从未生效：
; 此前启动日志里的 "position" 实际来自 API 默认值兜底，不是 ini 命中。现合并为单一 [Logic] 节。
TargetScanKey=position
;
; ══ 【SW-CHARGE】充能冗余二次 call 删除（ZC-SW-CHARGE / landing_pack_sw_charge.md，L-SW-1；默认 0）══
; EnableSWChargeOpt = 0 | 1（默认 0）
;   1 = init 时把 SuperClass::HasChargeProgressed 慢路径对纯函数 GetCameoChargeState 的
;       **冗余二次 call**（@0x006CBE88 的 7B「8B CE E8 51 00 00 00」）等长替换为 90×7，
;       复用第一次结果 eax ⇒ @0x6CBE8F 写回值不变 ⇒ 零语义变化、不进帧 CRC/Checksum。
;       · 守卫窗：@0x6CBE86(74 15) / @0x6CBE8F(89 46 78) / 首次 call @0x6CBE7E(E8 5D 00 00 00)
;         任一不符 ⇒ 拒装。
;       · 禁区（一字不动）：GetCameoChargeState 公式（@0x6CBEE0）/ RechargeTimer 推进 /
;         IsCharged 翻转帧 / ChargeDrainState FSM / HasChargeProgressed 七项副作用链
;         （禁跳帧、禁按视觉帧节流）。
;       · 附录 L-SW-2（Cameo 读 +0x78 缓存）**默认不做**，未过 frame=-1 真机 Q2 前禁装。
;   0 = 不碰 .text（默认，零行为变化）。
;   ★ 安装态 init 决定，改键须重启；零语义变化 ⇒ MP 可装可保留（不强制关）。
EnableSWChargeOpt=0

[Speed]
; UnlockGameSpeed: 设为 0 彻底保护玩家的原版游戏速度控制权
; 恢复键盘加速/降速按键（-, +）以及游戏设置菜单内“游戏速度”与“屏幕滚动速度”滑块的完全灵敏响应
; 游戏在 800 单位重载下的流畅度由底层 L1 向量化渲染与 L2 寻敌轮询提供，无需暴力劫持时钟
UnlockGameSpeed=0

[System]
; 启用 Low Fragmentation Heap (LFH) 低碎片堆内存分配器，杜绝粒子、子弹和音效的堆碎片与分配延迟
EnableLFH=1
; 锁定 Windows 系统时钟中断周期为 1ms，彻底消除 16ms 线程调度抖动与帧生成微卡顿
HighPrecisionTimer=1

[FogOfWar]
; 启用星际争霸式三态战争迷雾（开局全黑黑幕，探索后单位离开退回半透明灰雾）
; 灰雾中保留静态建筑与地形基础设施的最后已知影像，但敌方机动部队（坦克/步兵/战机）彻底隐形
; 只有己方或盟友部队提供实时直视视野时方全彩可见；部队离开即退回半透明隐形
EnableStarCraftFog=1
; ── 【FOG-SPLIT】灰雾总闸（唯一门控，不新增键）──────────────────────────────
; ★ 语义（2026-09-27 用户裁决重定义）：本键**只管「已探索(引擎 cf_Explored) 且当前无我方/盟友直视」这一档的压暗强度**。
;   =1（默认）：该档压暗强度 = 256（我方 50% 等效观感）—— 与旧版观感一致。
;   =0：该档压暗强度**归零** —— 主视图该档不压暗；小地图也不驱动引擎减暗（即只关「已探索非直视」档）。
; 三态表（主视图与小地图同口径）：
;   · 未探索格（引擎 CellClass::Shroudedness(+0x120) == -2「Occluded completely」）
;     ⇒ **原版全黑黑幕原样保留**：由引擎 CellClass::Draw → 0x0047EFE0（该位=0 时用 SHROUD.SHP）绘制，
;        我方零介入（不绘制 / 不混色 / 不驱动引擎判定位）⇒ 本档与总闸取值**无关**，=0 时黑幕不得消失。
;   · 已探索 + 非直视 ⇒ **仅此档受总闸控制**（=1 压暗 / =0 不压暗；=0 时小地图亦不驱动减暗）。
;   · 已探索 + 直视   ⇒ 一律不压暗（=1 / =0 相同）。
; 玩法（逻辑）可见性**不受本键影响**：EnableBuildingFog / EnableBulletFog / EnableUnitFog 三键各自独立生效，
;   总闸=0 时仍然生效（敌方建筑三态、迷雾中敌方弹道剔除、迷雾中敌方机动单位剔除）。
; 运行期判定：改本键后 ≤1 帧生效（无需重载 ini；汇编侧镜像按每帧遥测节拍同步）。
; 机器判据（2 秒遥测行：既有 [ra2render-telemetry-fogswitch] + 追加 [ra2render-telemetry-fogsplit]，新增字段一律追加在后）：
;   =0 档应满足：未探索黑幕绘制次数 > 0、未探索格放行次数 > 0、
;                已探索非直视压暗次数 ≡ 0、小地图已探索非直视减暗驱动次数 ≡ 0、
;                玩法层三计数（机动单位剔除 / 建筑剔除 / 弹道剔除）> 0 且量级与总闸=1 相当。
;   =0 档下三个既有计数仍恒 0：半透明层绘制次数 / 混色桩介入次数 / 小地图减暗驱动次数
;                （总闸=0 时我方不调用引擎 FOG.SHP 层 0x0047F250 ⇒ 混色桩 B1/B2 自然不介入）。
; 【FOG-SPLIT 与总闸解耦的三处】旧版总闸=0 曾把下列三条一并切断，导致未探索黑幕随之消失（ZC-4 S2 实测 = 等同开图）：
;   ① UpdateVisionGrid 每格恒调用（维持 Scenario FogOfWar 位=0 ⇒ 黑幕层走 SHROUD.SHP 而非 FOG.SHP）；
;   ② L4 视口全量刷（0x006D3D99）恒强制全量重绘（不再随总闸回退原版 jge）；
;   ③ 玩法可见性三键与总闸解耦（见下）。
; 小地图侧仍受总闸约束：「已探索非直视」档的减暗驱动需总闸=1（=0 时不驱动引擎减暗判定位 [esp+0x13]）——
;   但未探索格我方**不写**该判定位（保持引擎自身判定 ⇒ 小地图黑幕不被我方影响）。
;
; ══ 【FOG-MODE】可见性模式总键（F1 新增，2026-09-28 用户裁决：「两种，一种是原版的一种是现在的状态」）══
; VisibilityMode = starcraft | vanilla（默认 starcraft，= 现状，键缺失/非法值都收敛为此）
;   · starcraft ⇒ **现状态**：视距剔除生效 —— EnableUnitFog / EnableBuildingFog / EnableBulletFog
;                  三子键按现有语义各自生效（灰雾区/未探索黑区里的敌方单位、建筑、弹道按视距剔除）。
;   · vanilla   ⇒ **原版可见性**：**不做任何视距剔除** —— 单位/建筑/弹道三处剔除**全部放行**
;                  （直接走原版 Draw）⇒ 敌方目标在任何区域（含灰雾区、未探索黑区）都会绘制。
; ★ 优先级（F1）：vanilla 时三个子键 EnableUnitFog / EnableBuildingFog / EnableBulletFog
;   **被本键覆盖（忽略）**；启动日志 [ra2render-visibility] 与 2 秒遥测行
;   [ra2render-telemetry-visibility] 会逐键显式标注「被 VisibilityMode 覆盖 -> 放行(不剔除)」。
;   starcraft 时不覆盖，三子键照旧生效。
; ★ vanilla 的纪律：门控在**运行期**每帧直读（改本键 ≤1 帧生效），且**不写任何引擎状态、不改 RNG/命令序**
;   —— 只是「不介入绘制」。它**不**触碰 Scenario FogOfWar 位，**未探索黑幕仍由引擎路径保留**。
; ★ 两种状态的规范组合（F2）：
;     [现状态] EnableStarCraftFog=1 + VisibilityMode=starcraft（= 本 ini 默认）
;              ⇒ 灰雾压暗 + 视距剔除（远方敌军不可见）
;     [原版态] EnableStarCraftFog=0 + VisibilityMode=vanilla
;              ⇒ 无灰雾 + 无视距剔除 = 原版可见性（**未探索黑幕仍保留**，因为黑幕由引擎路径绘制）
;   混搭（允许，但观感后果自担）：
;     · EnableStarCraftFog=1 + VisibilityMode=vanilla ⇒ 灰雾照压暗，但雾里的敌方单位/建筑/弹道照常绘制
;       （观感＝「看得见，但画面很暗」；战术上等于给我方开图，仅建议做 A/B 对照用）
;     · EnableStarCraftFog=0 + VisibilityMode=starcraft ⇒ 地图明亮（已探索区不压暗），
;       但远处敌军仍按视距隐形（观感＝「亮着的黑箱」，敌方目标会「凭空出现」）
;     · 只有 [原版态] 组合才是完整原版可见性观感。
; ★ 机器判据（真机读 [ra2render-telemetry-visibility] 行即可判定档位）：
;   vanilla   ⇒ 机动单位剔除 ≡0 且 建筑剔除 ≡0 且 弹道剔除 ≡0，且「被 mode 覆盖而放行」>0；
;   starcraft ⇒ 三处剔除计数按视野圈判定增长，且「被 mode 覆盖而放行」≡0。
VisibilityMode=starcraft
;
; 间谍卫星重构为星际人族雷达（Scanner Sweep: 有 CD 的区域扫描超武，不再全图永久点亮）
EnableSpySatRadarSweep=1
; 雷达扫描超武冷却时间（帧数，默认 600 帧，即标准速度下约 40 秒 CD）
RadarSweepCooldownFrames=600
; 雷达扫描超武探测半径（格子数，默认 16 格大范围直视揭示）
RadarSweepRadiusCells=16


; L5 迷雾正确性补全（v1.6.0）
; 敌方建筑迷雾化：从未被侦察过的敌建筑隐形；被侦察过则常驻可见（WC3 式"看见过即保持"）
; 【FOG-SPLIT】逻辑可见性键：不受总闸影响（总闸=0 时仍然生效；由 Hook_Building_Draw 独立门控）
EnableBuildingFog=1
; 迷雾中敌方弹道剔除：直视圈外敌方开火不再显示炮弹/火箭弹
; 【FOG-SPLIT】逻辑可见性键：不受总闸影响（总闸=0 时仍然生效；由 Hook_Bullet_Draw 独立门控）
EnableBulletFog=1
; 迷雾中敌方机动单位剔除（坦克 / 步兵 / 战机）：非直视格上的敌方机动单位彻底隐形
; 【FOG-SPLIT】逻辑可见性键：不受总闸影响（总闸=0 时仍然生效；由 Hook_Unit/Infantry/Aircraft_Draw 独立门控）
; 【FOG-SPLIT】本键为**新增子键**，API 默认值 = 1（键缺失即开启，与旧行为一致）：
;   旧版该能力被总闸裹挟（总闸=0 ⇒ 「迷雾剔除机动单位」恒 0），违反「总闸只管画面表现」的语义，故独立成键。
EnableUnitFog=1
; 灰雾 4 帧渐变过渡：视野进出时灰雾平滑渐入渐出，替代硬切换（SC2 式观感）
; 【FOG-SPLIT】表现层键：仅在总闸=1 时才有意义（总闸=0 时「已探索非直视」档强度归零，本键自然失效）
FadeFogTransition=1
; 雷达小地图迷雾化：迷雾区域小地图同步 50% 减暗，敌军单位点不再暴露
; 【G-01 门控】API 默认值仍为 0（键缺失即关闭）。单机测试请置 1；联机模式(MpActive)下仍强制 0。
; 【RADAR-FIX2 待裁决】本项尚未通过真机验收（ZC-3 未跑），故出厂默认仍为 0：
;   如需启用雷达迷雾，先置 EnableMinimapFog=1 再按 ZC-3 步骤验收。
; 【FOG-SPLIT】本键为「小地图减暗」子键：**只**管「已探索非直视」档的减暗驱动，需总闸=1 才生效
;   （总闸=0 时小地图不驱动引擎减暗判定位；未探索格的黑幕两档都不由我方驱动）。
EnableMinimapFog=0
; 【RADAR-FIX2 F2】雷达灰化档位（P0 修复 ZC-2 S3 FAIL：分支进入计数增长但像素恒 0）
;   根因（字节级）：0x00655D38 处 EAX 并非 CellClass*，而是 MapClass::GetCellFloorHeight()
;   （0x578080）返回的**格面高度 int**（写入 CoordStruct.Z）⇒ 旧代理首道 pCell 合法性护栏
;   恒被拒，灰化分支静默早退。0x00B73550 亦非迷雾开关（= Game::hWnd 主窗口句柄，不可写）。
;   0 = 旧护栏 + 自绘灰化：把 0x00A8B238 当「游戏状态」，==0 跳过。该前提已证伪
;       （0x00A8B238 = SessionClass::Instance.GameMode，战役局内恒 0），仅用于真机对照复现。
;   1 = 新谓词 + 自绘灰化（A/B 对照档）：PlayerPtr!=0 && Scenario!=0 && GameMode<=5
;       + 雷达双表面有效（[0x87F7E8+0x121C]/[+0x1220]）；像素公式 (c>>1)&0x7BEF，与引擎减暗体逐通道等价。
;       ★ 勘误：原第 3 项「Scenario+0x3598==0（IsLoadingScreen）」已删除 —— 该偏移无据
;         （YRpp 记为 DWORD unknown_3598；全 exe 均为字节粒度门控；真机实测 = 0x92）。
;   2 = 不设护栏 + 自绘灰化（真机隔离对照用）
;   3 = 引擎原生减暗驱动（本版默认）：在 0x00655D87 按我方三态视野谓词
;       （已探索 && 非直视圈内）改写引擎减暗判定位 [esp+0x13]，**不自绘任何像素**，
;       直接复用引擎减暗体（0x655E8A–0x655F43，像素精确 50% 减暗）。
;       【FOG-SPLIT】未探索格**不写**该判定位（保持引擎自身判定 ⇒ 小地图黑幕不被我方影响）。
; 【FOG-SPLIT】mode 3 的「驱动」路径只服务「已探索非直视」档 ⇒ 需总闸=1；总闸=0 时本键整体失效。
RadarFogGuardMode=3
;
; ══ 【GAP-P223】裂缝保护三点表驱动（ZC-GAP-P223 合并 ZC-GAP-P21；默认 0 = 不碰 .text）══
; EnableGapProtection = 0 | 1（默认 0）
;   背景（R-GAP-PSY 静态定谳）：三个函数内层循环各含**恰好一次**「清 GapsCoveringThisCell(+0x134)」
;     store（Q4 闭合，无第 4 处）——清零使 CellClass::ReshroudCell(0x487690) 把 ShroudCounter
;     钳位到 0 ⇒ 敌方 GapGenerator 覆盖区在开图/重遮后**永久静默失能**（CreateGap/DestroyGap 不自愈）。
;   1 = init 时把三点各 6B **等长替换**为 90×6（nop），只删这一次 store，同循环其余写入原样保留：
;       P-2.1 MapClass::RevealArea2 @0x005678E0  @0x00568273 (89 99 34 01 00 00) mov [ecx+0x134], ebx
;            覆盖面：PsychicReveal 双调 @0x6CD773/0x6CD79C + 22 个 E8 caller（超武/任务脚本揭示…）
;            保留：ShroudCounter<-0(@0x0056824A) / CopyFlags|=0x10(@0x0056829A)
;       P-2.2 MapClass::RevealArea3 @0x00577D90  @0x00577EC5 (89 B8 34 01 00 00) mov [eax+0x134], edi
;            覆盖面：SpySat 全图开 + 旁路 @0x481FC3
;            保留：ShroudCounter<-0(@0x00577EBF) / CopyFlags|=0x18(@0x00577ED4)
;       P-2.3 MapClass::Reshroud    @0x00577AB0  @0x00577B60 (89 98 34 01 00 00) mov [eax+0x134], ebx
;            覆盖面：SpySat 离线重遮 + 旁路 @0x50BD20
;            保留：CopyFlags&=~0x18(@0x00577B4E) / ShroudCounter<-1(@0x00577B56) / RedrawFlags&=~0x3(@0x00577B66)
;       · 等长硬约束：6B==6B，禁 trampoline / 禁动 .detour 节；只许纯 90（禁 89→8B 等翻法：
;         P-2.2 的 edi、P-2.3 的 ebx 零常量在循环内仍被消费；cmp→jl/je 类邻接 flags 关系必须保持）。
;       · 窗前/窗后上下文窗按实测宽度自检（P-2.1 2+2B / P-2.2 6+6B / P-2.3 10+6B），任一不符整包不写。
;       · 若目标已是 90×6（外部安装者）：停手、只告警、不写不还原（Q1 门禁）。
;   0 = 不碰 .text（默认，零行为变化）。
;   ★ 安装序 P-2.1→P-2.2→P-2.3；硬回滚强制逆序 P-2.3→P-2.2→P-2.1；安装态在 init 决定
;     （本键只 LoadConfig 读一次）⇒ 改键须重启游戏/重载 DLL 生效。
;   ★ 遥测 gapProtectionPatchesInstalled ∈ 0..3 = 本进程实际写入的 NOP 点数（装几点算几点）；
;     启动日志打 GapProtection=on|off|forced-off-mp + installed=N，2 秒遥测行打印该计数；
;     仅 installed==3 才满足产品契约（存档标记 GapProt Version / MP 握手期望值）。
;   ★ 联机门控：MpActive=true 时**强制不装**（R-1 混端 DESYNC：+0x134 进 .SAV 且参与同步演进，
;     必须全端同构建同开关）。
;   ★ 只改已加载映像的内存字节：磁盘 gamemd.exe 只读不改（RE_COORDINATION 红线 §3-1）。
;   ★ 键名 EnableGapProtectP22/P23 不建、不占用（三点是一个保护包，同键一键装齐）。
;   ★ 真机验收：A1 默认无补丁不崩 / A2 =1 三点 6B=NOP、邻窗未动、installed=3 /
;     A3–A5 行为验收（敌方裂缝+开图后缝仍在 / 存读档 / 旁路未清零）走战役模式另卡
;     landing_pack_gap_p21_a3.md（ra2bench 遭遇战不可达：无预置建筑 + 触发器不触发）。
EnableGapProtection=0
;
; ══ 【FOG-CAL2】灰雾净强度校准键（F1 换算订正 + 可达域扩展，2026-09-28）══
; FogStrengthPct = auto | <0..100>（默认 auto；数值允许小数，如 35.9375 / 71.875）
;   · T = 目标「净压暗（保留比例）」百分比 = 100 × 雾中像素亮度 / 同点无雾像素亮度。
;     ★方向：T **越大画面越亮**（桩强度 s 越小）；T = 35.9375 即现网 auto 观感；T = 71.875 为最亮上限。
;   · auto（默认；键缺失/空串/非法串都收敛为此）⇒ **不补偿**：桩强度保持设计值 s=256，观感与校准前部署**逐像素一致**
;     （回归基线：FOG-STRENGTH2 实测净保留 ≈0.359375 = 23/64 = 0.5 × 0.71875 ⇒ 等效 T = 35.9375）。
;   · 订正后的换算（旧版 s=round(m×256) 为**错误口径**；勘误见 docs/re/fog_strength_calibration.md §3）：
;        m = (T/100) / 0.71875
;        s = clamp(round(512 × (1 − m)), 0, 511)      ← 上限 511 而非 512（避免 16 位通道回绕，见 §2）
;     写入点 = 我方灰雾混色桩的唯一强度全局（Hook_CellClass_Draw 内、调用引擎 0x0047F250 之前），热路径两态运行期分支。
;   · 换算表（离线复算脚本 out/re_work/fog_cal2/sim_fogcal2.py；「←」标注为口径自洽校验点）：
;        T           m          s     预测净压暗(=保留比例≈T/100)
;        0           0.000000   511   0.001404   ← 最暗（近乎全黑）
;        20          0.278261   370   0.199341
;        35.9375     0.500000   256   0.359375   ← **= 现网 auto**（自洽校验点）
;        43.75       0.608696   200   0.437988
;        50          0.695652   156   0.499756   ← 设计意图「净保留 50%」
;        60          0.834783   85    0.599431
;        71.875      1.000000   0     0.718750   ← 最亮（只剩上游第一段）
;   · ★0.71875 = 184/256 = 23/32 =「第一段经验系数」：实测来源 docs/re/fog_strength_rootcause.md §F1.7/§F3
;     （上游地表侧乘性压暗，位于我方桩**之前**）。该段**代码站点尚未静态定位**（P1，另案真机实验）⇒ 本系数为经验系数，
;     第一段定位/抵消后须重校（源码中唯一真源 = s_fogFirstStageGainUpstream，改此一处即可）。
;   · ★可达域（诚实口径）：T ∈ [0, 71.875] ⇒ 预测净压暗 ∈ [0.001404, 0.718750]；
;     T > 71.875 **不可达**（画面不可能比"只剩上游第一段"更亮）⇒ 一律钳到最亮 s=0（= T=71.875 同值）并在启动日志告警。
;     **不得假装可达**。
;   · ★运行期判定（**[ZC-10B ②] 勘误后口径**）：s 由运行期全局承载，热路径直读；本键按 ≈2 秒遥测节拍
;     重读 ini 并更新全局（SyncFogStrengthMirror）⇒ **一局内改键 ≈2 秒内生效**（不再需要重启）。
;     · 历史错注释（已修）：「热路径直读 ⇒ 改值 ≤1 帧生效」—— 该句只对「直接写运行期全局」成立；
;       旧实现中 ini 只在 DLL init 读一次，改 ini 文件**不会**即时生效（ZC-9B 段 B 因此踩坑）。
;     · auto 仍 = s=256 不补偿；数值档换算沿用 FogStrengthPctToStubScale()，公式未改。
;     · 机器判据：运行期改值生效时打印 [ra2render-fogcal] 运行期同步行（含 旧s -> 新s / m / 预测净压暗）。
;   · ★机器判据（启动行 [ra2render-fogcal] / 2 秒行 [ra2render-telemetry-fogcal]）：两行均打印 生效值 / m / 桩强度 s / 预测净压暗。
;     auto ⇒ s=256 且预测净压暗=0.359375；数值档 T ⇒ s = clamp(round(512×(1−(T/100)/0.71875)),0,511) 且净压暗≈T/100。
;     真机核对步骤见 docs/re/fog_strength_calibration.md 附录 D（同场景 auto / T=50 同画面截图逐通道比值 ≈0.36 / ≈0.50）。
;   · ★字段改名（防解析口径漂移）：上一版「预测实测比值(净压暗系数)」→ 本版「预测净压暗(保留比例)」；并新增 m 字段。
;   · ★作用域边界：本键**只**改「已探索非直视」档的压暗强度（与总闸同作用域）；未探索黑幕、直视档、渐变档形状（同比例缩放）
;     与雷达小地图自绘灰化（shr eax,1 / and eax,0x7BEF 的 50% 档）**都不在本键作用域内**，逐档回归时勿混。
FogStrengthPct=auto

; ---------------------------------------------------------------------------
; [ZC-10B ①] L4DirtyMode —— L4 视口重绘策略（三档，默认 force-full = 现状）
;   force-full  （默认）= 恒强制全量重绘：与现网件逐位等价，零行为变化
;   vision-dirty       = 折中：仅当「视口内视野迁移数==0 且 视口渐变活跃数==0」时
;                         交还原版 jge（0x006D3D99 六字节原语义，走引擎增量/dirty-rect 路径）；否则仍强制全量
;   vanilla            = 完全交还原版 jge（等价于不打本补丁）
;   迁移计数由 Hook_CellClass_Draw 累计的视口格范围驱动（s_fogViewportTransitionCount /
;   s_fogViewportRampActive，2 秒遥测行 [ra2render-telemetry-l4dirty] 可见）。
;   ★依据：docs/re/l4_dirty_safety.md（判「安全」）+ docs/re/l4_dirty_spec_v2.md
;   ★排雷：ini 缺失 / 非法值一律收敛为 force-full（安全侧，画面不变）。
; ---------------------------------------------------------------------------
L4DirtyMode=force-full

; ---------------------------------------------------------------------------
; [ZC-10B ③] FogProbe —— 桩内「读取值」探针键控（默认 0 = 关）
;   0（默认）= B1/B2 混色桩热路径的探针开关 2 条指令直接短路：不采样、不计数、不进慢路径
;             ⇒ 探针工作量为 0，混色算术路径逐位不变
;   1        = 热路径 +2 指令（cmp/je）采样【桩读取强度值】，2 秒遥测行含 fogprobe 明细
;   ★真机 A/B（每像素 +2 指令的帧率代价）留给 ZC-11；默认 0 即恢复探针前件的热路径行为。
